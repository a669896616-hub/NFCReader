name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد الجافا (إصدار 17 ضروري للأدوات الحديثة)
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. إعطاء صلاحية التنفيذ لملف Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. بناء التطبيق (Build)
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # 5. حفظ الملف الناتج (APK) لكي تستطيع تحميله
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
