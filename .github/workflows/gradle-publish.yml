name: Build App
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # هادي كتخليك تخدمو يدوياً وقتما بغيتي

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: gradle

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # هادي هي الخطوة اللي كانت ناقصاك باش يبان ليك الرابط
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-NFC-App
          path: "**/*.apk"
